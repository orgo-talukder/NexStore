<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Apps | NexStore</title>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* =========================================
           Design System & Variables (Shared)
           ========================================= */
        :root {
            --bg-primary: #0B0F19;
            --bg-card: #111827;
            --bg-hover: #1e293b;
            --accent-primary: #4F8CFF;
            --accent-secondary: #6EA8FF;
            --text-primary: #F8FAFC;
            --text-secondary: #94A3B8;
            --success: #22C55E;
            --error: #EF4444;
            --border-color: rgba(255, 255, 255, 0.05);
            
            --font-main: 'Inter', sans-serif;
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* =========================================
           Navbar (Shared)
           ========================================= */
        header {
            background-color: rgba(11, 15, 25, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 70px;
        }

        .brand {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand span {
            color: var(--accent-primary);
        }

        .nav-links {
            display: flex;
            gap: 30px;
        }

        .nav-links a {
            font-weight: 500;
            color: var(--text-secondary);
            transition: var(--transition);
        }

        .nav-links a:hover, .nav-links a.active {
            color: var(--accent-primary);
        }

        .search-form {
            display: flex;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            width: 250px;
        }

        .search-form input {
            background: transparent;
            border: none;
            color: var(--text-primary);
            padding: 10px 15px;
            width: 100%;
            outline: none;
            font-family: var(--font-main);
        }

        .search-form button {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 0 15px;
            cursor: pointer;
            transition: var(--transition);
        }

        .search-form button:hover {
            color: var(--accent-primary);
        }

        /* =========================================
           Page Header & Toolbar
           ========================================= */
        .page-header {
            margin: 40px 0 30px 0;
        }
        
        .page-title {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-card);
            padding: 15px 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            flex-wrap: wrap;
            gap: 15px;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .filter-label {
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
        }

        select {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 6px;
            font-family: var(--font-main);
            font-size: 14px;
            outline: none;
            cursor: pointer;
            transition: var(--transition);
        }

        select:hover, select:focus {
            border-color: var(--accent-primary);
        }

        /* =========================================
           App Grid & Cards (Shared)
           ========================================= */
        .app-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 50px;
        }

        .app-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            gap: 15px;
            transition: var(--transition);
            cursor: pointer;
        }

        .app-card:hover {
            transform: translateY(-3px);
            border-color: var(--accent-primary);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            background: var(--bg-hover);
        }

        .app-icon {
            width: 70px;
            height: 70px;
            border-radius: 16px;
            object-fit: cover;
            background-color: var(--bg-primary);
        }

        .app-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .app-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .official-badge {
            color: var(--success);
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .app-desc {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 8px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .app-meta {
            display: flex;
            gap: 15px;
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        /* =========================================
           States (Loading, Empty, Error)
           ========================================= */
        .status-container {
            padding: 60px 0;
            text-align: center;
            background: var(--bg-card);
            border-radius: 12px;
            border: 1px dashed var(--border-color);
            grid-column: 1 / -1;
        }
        
        .loading-text { color: var(--accent-primary); font-weight: 500; }
        .empty-text { color: var(--text-secondary); }
        .error-text { color: var(--error); }

        /* =========================================
           Footer (Shared)
           ========================================= */
        footer {
            margin-top: 40px;
            padding: 40px 0;
            background: var(--bg-card);
            border-top: 1px solid var(--border-color);
            text-align: center;
            color: var(--text-secondary);
            font-size: 14px;
        }

        footer p {
            margin-bottom: 10px;
        }

        /* =========================================
           Responsive Design
           ========================================= */
        @media (max-width: 768px) {
            .navbar { flex-wrap: wrap; height: auto; padding: 15px 0; gap: 15px; }
            .nav-links { order: 3; width: 100%; justify-content: center; gap: 20px; }
            .search-form { order: 2; width: auto; flex: 1; }
            .toolbar { flex-direction: column; align-items: flex-start; }
            .app-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- Header & Navigation -->
    <header>
        <div class="container navbar">
            <a href="index.html" class="brand">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--accent-primary);">
                    <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                    <polyline points="2 17 12 22 22 17"></polyline>
                    <polyline points="2 12 12 17 22 12"></polyline>
                </svg>
                Nex<span>Store</span>
            </a>
            
            <nav class="nav-links">
                <a href="index.html">Home</a>
                <a href="apps.html" class="active">Apps</a>
                <a href="categories.html">Categories</a>
                <a href="about.html">About</a>
            </nav>

            <form class="search-form" id="search-form">
                <input type="text" id="search-input" placeholder="Search apps..." required>
                <button type="submit">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                </button>
            </form>
        </div>
    </header>

    <main class="container">
        
        <div class="page-header">
            <h1 class="page-title">All Applications</h1>
            
            <!-- Filter & Sort Toolbar -->
            <div class="toolbar">
                <div class="filter-group">
                    <span class="filter-label">Category:</span>
                    <select id="category-filter">
                        <option value="all">All Categories</option>
                        <option value="AI">AI</option>
                        <option value="Productivity">Productivity</option>
                        <option value="Utility">Utility</option>
                        <option value="Security">Security</option>
                        <option value="Developer Tools">Developer Tools</option>
                        <option value="Education">Education</option>
                        <option value="Entertainment">Entertainment</option>
                    </select>
                </div>
                
                <div class="filter-group">
                    <span class="filter-label">Sort By:</span>
                    <select id="sort-filter">
                        <option value="newest">Newest First</option>
                        <option value="popular">Most Popular</option>
                        <option value="name">Name (A-Z)</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Apps Container -->
        <div id="all-apps-container" class="app-grid">
            <div class="status-container loading-text">Loading applications...</div>
        </div>

    </main>

    <!-- Footer -->
    <footer>
        <div class="container">
            <p>&copy; <span id="year"></span> NexStore. Official App Ecosystem.</p>
            <p>All apps are distributed directly by Nex. No third-party submissions.</p>
        </div>
    </footer>

    <!-- JavaScript & Firebase Integration -->
    <script type="module">
        import { db } from './js/firebase-init.js';
        import { collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        document.getElementById('year').textContent = new Date().getFullYear();

        // Search Form Logic
        document.getElementById('search-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const queryVal = document.getElementById('search-input').value.trim();
            if (queryVal) {
                window.location.href = `search.html?q=${encodeURIComponent(queryVal)}`;
            }
        });

        // Global state to store apps for client-side filtering/sorting
        let globalAppsList = [];

        // App Card Generator
        function createAppCard(app) {
            const icon = app.iconUrl || 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="70" height="70" fill="%23111827"><rect width="70" height="70"/></svg>';
            const name = app.name || 'Unknown App';
            const shortDesc = app.shortDescription || 'No description available.';
            const rating = app.rating ? `★ ${app.rating}` : 'New';
            const size = app.apkSize ? `• ${app.apkSize}` : '';

            return `
                <a href="app.html?id=${app.id}" class="app-card">
                    <img src="${icon}" alt="${name}" class="app-icon" loading="lazy">
                    <div class="app-info">
                        <div class="app-title">
                            ${name}
                            <span class="official-badge" title="Official Nex App">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                            </span>
                        </div>
                        <p class="app-desc">${shortDesc}</p>
                        <div class="app-meta">
                            <span>${rating}</span>
                            <span>${size}</span>
                        </div>
                    </div>
                </a>
            `;
        }

        // Render Function
        function renderApps(apps) {
            const container = document.getElementById('all-apps-container');
            if (apps.length === 0) {
                container.innerHTML = `<div class="status-container empty-text">No apps found matching your criteria.</div>`;
                return;
            }
            
            let html = '';
            apps.forEach(app => {
                html += createAppCard(app);
            });
            container.innerHTML = html;
        }

        // Apply Filters and Sorting
        function applyFiltersAndSort() {
            const categorySelect = document.getElementById('category-filter').value;
            const sortSelect = document.getElementById('sort-filter').value;

            // Filter
            let processedApps = globalAppsList;
            if (categorySelect !== 'all') {
                // Check if app.category matches exactly (case insensitive ideally, but exact for MVP)
                processedApps = processedApps.filter(app => 
                    app.category && app.category.toLowerCase() === categorySelect.toLowerCase()
                );
            }

            // Sort
            processedApps.sort((a, b) => {
                if (sortSelect === 'popular') {
                    return (b.downloads || 0) - (a.downloads || 0);
                } else if (sortSelect === 'name') {
                    return (a.name || '').localeCompare(b.name || '');
                } else {
                    // 'newest' default
                    const timeA = a.createdAt ? (a.createdAt.toMillis ? a.createdAt.toMillis() : new Date(a.createdAt).getTime()) : 0;
                    const timeB = b.createdAt ? (b.createdAt.toMillis ? b.createdAt.toMillis() : new Date(b.createdAt).getTime()) : 0;
                    return timeB - timeA;
                }
            });

            renderApps(processedApps);
        }

        // Fetch Data from Firestore
        async function fetchAllApps() {
            try {
                const appsRef = collection(db, "apps");
                const q = query(appsRef, where("published", "==", true));
                const querySnapshot = await getDocs(q);
                
                const allApps = [];
                querySnapshot.forEach((doc) => {
                    allApps.push({ id: doc.id, ...doc.data() });
                });

                globalAppsList = allApps;

                // Handle URL parameter sorting (e.g., from index.html -> apps.html?sort=popular)
                const urlParams = new URLSearchParams(window.location.search);
                const sortParam = urlParams.get('sort');
                if(sortParam && ['popular', 'newest', 'name'].includes(sortParam)) {
                    document.getElementById('sort-filter').value = sortParam;
                }

                applyFiltersAndSort();

            } catch (error) {
                console.error("Error fetching apps:", error);
                document.getElementById('all-apps-container').innerHTML = 
                    `<div class="status-container error-text">Unable to load apps right now. Please try again later.</div>`;
            }
        }

        // Event Listeners for Filters
        document.getElementById('category-filter').addEventListener('change', applyFiltersAndSort);
        document.getElementById('sort-filter').addEventListener('change', applyFiltersAndSort);

        // Initialize
        document.addEventListener('DOMContentLoaded', fetchAllApps);
    </script>
</body>
</html>
