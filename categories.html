<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories | NexStore</title>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* =========================================
           Design System & Variables (Shared)
           ========================================= */
        :root {
            --bg-primary: #0B0F19;
            --bg-card: #111827;
            --bg-hover: #1e293b;
            --accent-primary: #4F8CFF;
            --accent-secondary: #6EA8FF;
            --text-primary: #F8FAFC;
            --text-secondary: #94A3B8;
            --success: #22C55E;
            --error: #EF4444;
            --border-color: rgba(255, 255, 255, 0.05);
            
            --font-main: 'Inter', sans-serif;
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* =========================================
           YouTube Style Top Loading Bar
           ========================================= */
        #top-progress-bar {
            position: fixed;
            top: 0;
            left: 0;
            height: 3px;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
            box-shadow: 0 0 10px rgba(79, 140, 255, 0.8), 0 0 5px var(--accent-primary);
            z-index: 99999;
            transition: width 0.25s ease, opacity 0.4s ease;
            pointer-events: none;
            border-radius: 0 2px 2px 0;
        }

        /* =========================================
           Navbar (Shared)
           ========================================= */
        header {
            background-color: rgba(11, 15, 25, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 70px;
        }

        .brand {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand span {
            color: var(--accent-primary);
        }

        .nav-links {
            display: flex;
            gap: 30px;
        }

        .nav-links a {
            font-weight: 500;
            color: var(--text-secondary);
            transition: var(--transition);
        }

        .nav-links a:hover, .nav-links a.active {
            color: var(--accent-primary);
        }

        .search-form {
            display: flex;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            width: 250px;
        }

        .search-form input {
            background: transparent;
            border: none;
            color: var(--text-primary);
            padding: 10px 15px;
            width: 100%;
            outline: none;
            font-family: var(--font-main);
        }

        .search-form button {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 0 15px;
            cursor: pointer;
            transition: var(--transition);
        }

        .search-form button:hover {
            color: var(--accent-primary);
        }

        /* =========================================
           Category Specific Styles
           ========================================= */
        .page-header {
            margin: 40px 0 30px 0;
            text-align: center;
        }
        
        .page-title {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 10px;
        }
        
        .page-subtitle {
            color: var(--text-secondary);
            font-size: 16px;
        }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 50px;
        }

        .category-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            transition: var(--transition);
        }

        .category-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-primary);
            background: var(--bg-hover);
        }

        .category-card.active {
            border-color: var(--accent-primary);
            background: rgba(79, 140, 255, 0.1);
        }

        .cat-icon {
            width: 50px;
            height: 50px;
            background: rgba(79, 140, 255, 0.1);
            color: var(--accent-primary);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .cat-info h3 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .cat-info p {
            font-size: 13px;
            color: var(--text-secondary);
        }

        /* =========================================
           App Grid & Cards (Shared)
           ========================================= */
        .results-header {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            display: none;
        }

        .app-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 50px;
        }

        .app-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            gap: 15px;
            transition: var(--transition);
            cursor: pointer;
        }

        .app-card:hover {
            transform: translateY(-3px);
            border-color: var(--accent-primary);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            background: var(--bg-hover);
        }

        .app-icon {
            width: 70px;
            height: 70px;
            border-radius: 16px;
            object-fit: cover;
            background-color: var(--bg-primary);
        }

        .app-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .app-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .official-badge {
            color: var(--success);
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .app-desc {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 8px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .app-meta {
            display: flex;
            gap: 15px;
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        /* States */
        .status-container {
            padding: 60px 0;
            text-align: center;
            background: var(--bg-card);
            border-radius: 12px;
            border: 1px dashed var(--border-color);
            grid-column: 1 / -1;
        }
        
        .loading-text { color: var(--accent-primary); font-weight: 500; }
        .empty-text { color: var(--text-secondary); }
        .error-text { color: var(--error); }

        /* =========================================
           Footer (Shared)
           ========================================= */
        footer {
            margin-top: 40px;
            padding: 40px 0;
            background: var(--bg-card);
            border-top: 1px solid var(--border-color);
            text-align: center;
            color: var(--text-secondary);
            font-size: 14px;
        }

        footer p {
            margin-bottom: 10px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .navbar { flex-wrap: wrap; height: auto; padding: 15px 0; gap: 15px; }
            .nav-links { order: 3; width: 100%; justify-content: center; gap: 20px; }
            .search-form { order: 2; width: auto; flex: 1; }
            .category-grid { grid-template-columns: 1fr; }
            .app-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- YouTube Style Top Progress Bar -->
    <div id="top-progress-bar"></div>

    <!-- Header & Navigation -->
    <header>
        <div class="container navbar">
            <a href="index.html" class="brand">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--accent-primary);">
                    <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                    <polyline points="2 17 12 22 22 17"></polyline>
                    <polyline points="2 12 12 17 22 12"></polyline>
                </svg>
                Nex<span>Store</span>
            </a>
            
            <nav class="nav-links">
                <a href="index.html">Home</a>
                <a href="apps.html">Apps</a>
                <a href="categories.html" class="active">Categories</a>
                <a href="about.html">About</a>
            </nav>

            <form class="search-form" id="search-form">
                <input type="text" id="search-input" placeholder="Search apps..." required>
                <button type="submit" aria-label="Search">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                </button>
            </form>
        </div>
    </header>

    <main class="container">
        
        <div class="page-header">
            <h1 class="page-title">Explore Categories</h1>
            <p class="page-subtitle">Find the perfect app for your needs from our official ecosystem.</p>
        </div>

        <!-- Category Loading State -->
        <div id="loading-container" class="status-container loading-text">Loading categories...</div>

        <!-- Category Grid -->
        <div id="category-grid" class="category-grid" style="display: none;">
            <!-- Categories will be injected here via JS -->
        </div>

        <!-- Filtered Apps Section -->
        <h2 id="results-header" class="results-header"></h2>
        <div id="filtered-apps-container" class="app-grid"></div>

    </main>

    <!-- Footer -->
    <footer>
        <div class="container">
            <p>&copy; <span id="year"></span> NexStore. Official App Ecosystem.</p>
            <p>All apps are distributed directly by Nex. No third-party submissions.</p>
        </div>
    </footer>

    <!-- JavaScript & Supabase Integration -->
    <script type="module">
        import { supabase } from './js/supabase-init.js';

        // Set Dynamic Year
        document.getElementById('year').textContent = new Date().getFullYear();

        // Top YouTube-style Progress Bar Controller
        const progressBar = document.getElementById('top-progress-bar');
        
        function setProgress(percent) {
            if (!progressBar) return;
            progressBar.style.opacity = '1';
            progressBar.style.width = `${percent}%`;
            if (percent >= 100) {
                setTimeout(() => {
                    progressBar.style.opacity = '0';
                    setTimeout(() => { progressBar.style.width = '0%'; }, 350);
                }, 200);
            }
        }

        // Animate on navigation link click
        document.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', (e) => {
                const href = link.getAttribute('href');
                if (href && !href.startsWith('#') && !href.startsWith('mailto:') && !link.target) {
                    setProgress(60);
                }
            });
        });

        // Search Form
        document.getElementById('search-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const queryVal = document.getElementById('search-input').value.trim();
            if (queryVal) {
                setProgress(70);
                window.location.href = `search.html?q=${encodeURIComponent(queryVal)}`;
            }
        });

        // Default Fallback Categories with Icons
        const DEFAULT_CATEGORIES = [
            { id: 'ai', name: 'AI', icon: '🤖' },
            { id: 'productivity', name: 'Productivity', icon: '⚡' },
            { id: 'utility', name: 'Utility', icon: '🛠️' },
            { id: 'security', name: 'Security', icon: '🛡️' },
            { id: 'developer-tools', name: 'Developer Tools', icon: '💻' },
            { id: 'education', name: 'Education', icon: '📚' },
            { id: 'music', name: 'Music', icon: '🎵' },
            { id: 'entertainment', name: 'Entertainment', icon: '🎬' }
        ];

        let globalCategoriesList = [];
        let globalAppsList = [];

        // Fetch Categories and Published Apps from Supabase
        async function initCategoriesPage() {
            setProgress(30);
            try {
                // Parallel fetch for categories & published apps
                const [catsRes, appsRes] = await Promise.all([
                    supabase.from('categories').select('*').eq('enabled', true).order('display_order', { ascending: true }),
                    supabase.from('apps').select('*').eq('published', true)
                ]);

                setProgress(70);

                if (catsRes.data && catsRes.data.length > 0) {
                    globalCategoriesList = catsRes.data;
                } else {
                    globalCategoriesList = DEFAULT_CATEGORIES;
                }

                globalAppsList = appsRes.data || [];

                document.getElementById('loading-container').style.display = 'none';
                
                renderCategoryGrid();
                setProgress(100);
                
                // Check if a category was passed in URL (e.g., categories.html?category=AI)
                const urlParams = new URLSearchParams(window.location.search);
                const selectedCat = urlParams.get('category');
                
                if (selectedCat) {
                    selectCategory(selectedCat);
                }

            } catch (error) {
                console.error("Error fetching categories and apps:", error);
                setProgress(100);
                document.getElementById('loading-container').innerHTML = `<span class="error-text">Failed to load ecosystem data. Please try again.</span>`;
            }
        }

        // Render the categories with dynamic app counts
        function renderCategoryGrid() {
            const grid = document.getElementById('category-grid');
            grid.style.display = 'grid';
            let html = '';

            globalCategoriesList.forEach(cat => {
                const catName = cat.name || cat.id;
                const catId = cat.id || cat.name;
                
                // Count apps in this category
                const count = globalAppsList.filter(app => 
                    app.category && (
                        app.category.toLowerCase() === catName.toLowerCase() ||
                        app.category.toLowerCase() === catId.toLowerCase()
                    )
                ).length;
                
                const iconHtml = cat.icon ? cat.icon : '📁';

                html += `
                    <div class="category-card" data-category="${catName}" onclick="selectCategory('${catName}', '${catId}')">
                        <div class="cat-icon">
                            ${iconHtml}
                        </div>
                        <div class="cat-info">
                            <h3>${catName}</h3>
                            <p>${count} App${count !== 1 ? 's' : ''}</p>
                        </div>
                    </div>
                `;
            });

            grid.innerHTML = html;
        }

        // App Card Generator
        function createAppCard(app) {
            const icon = app.icon_url || 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="70" height="70" fill="%23111827"><rect width="70" height="70"/></svg>';
            const name = app.name || 'Unknown App';
            const shortDesc = app.short_description || 'No description available.';
            const rating = app.rating ? `★ ${app.rating}` : 'New';
            const size = app.apk_size ? `• ${app.apk_size}` : '';

            return `
                <a href="app.html?id=${app.id}" class="app-card">
                    <img src="${icon}" alt="${name}" class="app-icon" loading="lazy">
                    <div class="app-info">
                        <div class="app-title">
                            ${name}
                            <span class="official-badge" title="Official Nex App">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                            </span>
                        </div>
                        <p class="app-desc">${shortDesc}</p>
                        <div class="app-meta">
                            <span>${rating}</span>
                            <span>${size}</span>
                        </div>
                    </div>
                </a>
            `;
        }

        // Handle category selection
        window.selectCategory = function(categoryName, categoryId = null) {
            setProgress(60);

            // Update URL without refreshing
            const newUrl = new URL(window.location);
            newUrl.searchParams.set('category', categoryName);
            window.history.pushState({}, '', newUrl);

            // Update UI Active State
            document.querySelectorAll('.category-card').forEach(card => {
                if (card.dataset.category && card.dataset.category.toLowerCase() === categoryName.toLowerCase()) {
                    card.classList.add('active');
                } else {
                    card.classList.remove('active');
                }
            });

            // Filter Apps
            const filteredApps = globalAppsList.filter(app => 
                app.category && (
                    app.category.toLowerCase() === categoryName.toLowerCase() ||
                    (categoryId && app.category.toLowerCase() === categoryId.toLowerCase())
                )
            );
            
            // Update Results Section
            const header = document.getElementById('results-header');
            const container = document.getElementById('filtered-apps-container');
            
            header.style.display = 'block';
            header.innerHTML = `Apps in <span style="color: var(--accent-primary);">${categoryName}</span>`;
            
            if (filteredApps.length === 0) {
                container.innerHTML = `<div class="status-container empty-text">No apps found in this category yet.</div>`;
            } else {
                let html = '';
                filteredApps.forEach(app => {
                    html += createAppCard(app);
                });
                container.innerHTML = html;
            }

            setProgress(100);

            // Smooth scroll to results
            header.scrollIntoView({ behavior: 'smooth', block: 'start' });
        };

        // Initialize on DOM load
        document.addEventListener('DOMContentLoaded', initCategoriesPage);
    </script>
</body>
</html>
