<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories | NexStore</title>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* =========================================
           Design System & Variables (Shared)
           ========================================= */
        :root {
            --bg-primary: #0B0F19;
            --bg-card: #111827;
            --bg-hover: #1e293b;
            --accent-primary: #4F8CFF;
            --accent-secondary: #6EA8FF;
            --text-primary: #F8FAFC;
            --text-secondary: #94A3B8;
            --success: #22C55E;
            --error: #EF4444;
            --border-color: rgba(255, 255, 255, 0.05);
            
            --font-main: 'Inter', sans-serif;
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* =========================================
           Navbar (Shared)
           ========================================= */
        header {
            background-color: rgba(11, 15, 25, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 70px;
        }

        .brand {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand span {
            color: var(--accent-primary);
        }

        .nav-links {
            display: flex;
            gap: 30px;
        }

        .nav-links a {
            font-weight: 500;
            color: var(--text-secondary);
            transition: var(--transition);
        }

        .nav-links a:hover, .nav-links a.active {
            color: var(--accent-primary);
        }

        .search-form {
            display: flex;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            width: 250px;
        }

        .search-form input {
            background: transparent;
            border: none;
            color: var(--text-primary);
            padding: 10px 15px;
            width: 100%;
            outline: none;
            font-family: var(--font-main);
        }

        .search-form button {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 0 15px;
            cursor: pointer;
            transition: var(--transition);
        }

        .search-form button:hover {
            color: var(--accent-primary);
        }

        /* =========================================
           Category Specific Styles
           ========================================= */
        .page-header {
            margin: 40px 0 30px 0;
            text-align: center;
        }
        
        .page-title {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 10px;
        }
        
        .page-subtitle {
            color: var(--text-secondary);
            font-size: 16px;
        }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 50px;
        }

        .category-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            transition: var(--transition);
        }

        .category-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-primary);
            background: var(--bg-hover);
        }

        .category-card.active {
            border-color: var(--accent-primary);
            background: rgba(79, 140, 255, 0.1);
        }

        .cat-icon {
            width: 50px;
            height: 50px;
            background: rgba(79, 140, 255, 0.1);
            color: var(--accent-primary);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cat-info h3 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .cat-info p {
            font-size: 13px;
            color: var(--text-secondary);
        }

        /* =========================================
           App Grid & Cards (Shared)
           ========================================= */
        .results-header {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            display: none; /* Hidden until category is selected */
        }

        .app-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 50px;
        }

        .app-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            gap: 15px;
            transition: var(--transition);
            cursor: pointer;
        }

        .app-card:hover {
            transform: translateY(-3px);
            border-color: var(--accent-primary);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            background: var(--bg-hover);
        }

        .app-icon {
            width: 70px;
            height: 70px;
            border-radius: 16px;
            object-fit: cover;
            background-color: var(--bg-primary);
        }

        .app-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .app-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .official-badge {
            color: var(--success);
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .app-desc {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 8px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .app-meta {
            display: flex;
            gap: 15px;
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        /* States */
        .status-container {
            padding: 60px 0;
            text-align: center;
            background: var(--bg-card);
            border-radius: 12px;
            border: 1px dashed var(--border-color);
            grid-column: 1 / -1;
        }
        
        .loading-text { color: var(--accent-primary); font-weight: 500; }
        .empty-text { color: var(--text-secondary); }
        .error-text { color: var(--error); }

        /* =========================================
           Footer (Shared)
           ========================================= */
        footer {
            margin-top: 40px;
            padding: 40px 0;
            background: var(--bg-card);
            border-top: 1px solid var(--border-color);
            text-align: center;
            color: var(--text-secondary);
            font-size: 14px;
        }

        footer p {
            margin-bottom: 10px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .navbar { flex-wrap: wrap; height: auto; padding: 15px 0; gap: 15px; }
            .nav-links { order: 3; width: 100%; justify-content: center; gap: 20px; }
            .search-form { order: 2; width: auto; flex: 1; }
            .category-grid { grid-template-columns: 1fr; }
            .app-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- Header & Navigation -->
    <header>
        <div class="container navbar">
            <a href="index.html" class="brand">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--accent-primary);">
                    <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                    <polyline points="2 17 12 22 22 17"></polyline>
                    <polyline points="2 12 12 17 22 12"></polyline>
                </svg>
                Nex<span>Store</span>
            </a>
            
            <nav class="nav-links">
                <a href="index.html">Home</a>
                <a href="apps.html">Apps</a>
                <a href="categories.html" class="active">Categories</a>
                <a href="about.html">About</a>
            </nav>

            <form class="search-form" id="search-form">
                <input type="text" id="search-input" placeholder="Search apps..." required>
                <button type="submit">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                </button>
            </form>
        </div>
    </header>

    <main class="container">
        
        <div class="page-header">
            <h1 class="page-title">Explore Categories</h1>
            <p class="page-subtitle">Find the perfect app for your needs from our official ecosystem.</p>
        </div>

        <!-- Category Loading State -->
        <div id="loading-container" class="status-container loading-text">Loading categories...</div>

        <!-- Category Grid -->
        <div id="category-grid" class="category-grid" style="display: none;">
            <!-- Categories will be injected here via JS -->
        </div>

        <!-- Filtered Apps Section -->
        <h2 id="results-header" class="results-header"></h2>
        <div id="filtered-apps-container" class="app-grid"></div>

    </main>

    <!-- Footer -->
    <footer>
        <div class="container">
            <p>&copy; <span id="year"></span> NexStore. Official App Ecosystem.</p>
            <p>All apps are distributed directly by Nex. No third-party submissions.</p>
        </div>
    </footer>

    <!-- JavaScript & Firebase Integration -->
    <script type="module">
        import { db } from './js/firebase-init.js';
        import { collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        document.getElementById('year').textContent = new Date().getFullYear();

        // Search Form
        document.getElementById('search-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const queryVal = document.getElementById('search-input').value.trim();
            if (queryVal) {
                window.location.href = `search.html?q=${encodeURIComponent(queryVal)}`;
            }
        });

        // Predefined Ecosystem Categories with SVG Icons
        const CATEGORIES = [
            { name: 'AI', icon: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a2 2 0 0 1 2 2v2a2 2 0 0 1-2 2 2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z"></path><path d="M4 12a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2 2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"></path><path d="M20 12a2 2 0 0 1-2 2h-2a2 2 0 0 1-2-2 2 2 0 0 1 2-2h2a2 2 0 0 1 2 2z"></path><path d="M12 22a2 2 0 0 1-2-2v-2a2 2 0 0 1 2-2 2 2 0 0 1 2 2v2a2 2 0 0 1-2 2z"></path><circle cx="12" cy="12" r="2"></circle></svg>' },
            { name: 'Productivity', icon: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>' },
            { name: 'Utility', icon: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path></svg>' },
            { name: 'Security', icon: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>' },
            { name: 'Developer Tools', icon: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>' },
            { name: 'Education', icon: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 10v6M2 10l10-5 10 5-10 5z"></path><path d="M6 12v5c3 3 9 3 12 0v-5"></path></svg>' },
            { name: 'Music', icon: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>' },
            { name: 'Entertainment', icon: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect><line x1="7" y1="2" x2="7" y2="22"></line><line x1="17" y1="2" x2="17" y2="22"></line><line x1="2" y1="12" x2="22" y2="12"></line><line x1="2" y1="7" x2="7" y2="7"></line><line x1="2" y1="17" x2="7" y2="17"></line><line x1="17" y1="17" x2="22" y2="17"></line><line x1="17" y1="7" x2="22" y2="7"></line></svg>' }
        ];

        let globalAppsList = [];

        // Fetch apps and render categories
        async function initCategoriesPage() {
            try {
                // Fetch all apps to calculate counts and enable fast filtering
                const appsRef = collection(db, "apps");
                const q = query(appsRef, where("published", "==", true));
                const querySnapshot = await getDocs(q);
                
                querySnapshot.forEach((doc) => {
                    globalAppsList.push({ id: doc.id, ...doc.data() });
                });

                document.getElementById('loading-container').style.display = 'none';
                
                renderCategoryGrid();
                
                // Check if a category was passed in URL (e.g., categories.html?category=AI)
                const urlParams = new URLSearchParams(window.location.search);
                const selectedCat = urlParams.get('category');
                
                if (selectedCat) {
                    selectCategory(selectedCat);
                }

            } catch (error) {
                console.error("Error fetching apps for categories:", error);
                document.getElementById('loading-container').innerHTML = `<span class="error-text">Failed to load ecosystem data. Please try again.</span>`;
            }
        }

        // Render the static categories with dynamic counts
        function renderCategoryGrid() {
            const grid = document.getElementById('category-grid');
            grid.style.display = 'grid';
            let html = '';

            CATEGORIES.forEach(cat => {
                // Count apps in this category
                const count = globalAppsList.filter(app => app.category && app.category.toLowerCase() === cat.name.toLowerCase()).length;
                
                html += `
                    <div class="category-card" data-category="${cat.name}" onclick="selectCategory('${cat.name}')">
                        <div class="cat-icon">
                            ${cat.icon}
                        </div>
                        <div class="cat-info">
                            <h3>${cat.name}</h3>
                            <p>${count} App${count !== 1 ? 's' : ''}</p>
                        </div>
                    </div>
                `;
            });

            grid.innerHTML = html;
        }

        // App Card Generator
        function createAppCard(app) {
            const icon = app.iconUrl || 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="70" height="70" fill="%23111827"><rect width="70" height="70"/></svg>';
            const name = app.name || 'Unknown App';
            const shortDesc = app.shortDescription || 'No description available.';
            const rating = app.rating ? `★ ${app.rating}` : 'New';
            const size = app.apkSize ? `• ${app.apkSize}` : '';

            return `
                <a href="app.html?id=${app.id}" class="app-card">
                    <img src="${icon}" alt="${name}" class="app-icon" loading="lazy">
                    <div class="app-info">
                        <div class="app-title">
                            ${name}
                            <span class="official-badge" title="Official Nex App">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                            </span>
                        </div>
                        <p class="app-desc">${shortDesc}</p>
                        <div class="app-meta">
                            <span>${rating}</span>
                            <span>${size}</span>
                        </div>
                    </div>
                </a>
            `;
        }

        // Handle category selection
        window.selectCategory = function(categoryName) {
            // Update URL without refreshing
            const newUrl = new URL(window.location);
            newUrl.searchParams.set('category', categoryName);
            window.history.pushState({}, '', newUrl);

            // Update UI Active State
            document.querySelectorAll('.category-card').forEach(card => {
                if (card.dataset.category.toLowerCase() === categoryName.toLowerCase()) {
                    card.classList.add('active');
                } else {
                    card.classList.remove('active');
                }
            });

            // Filter Apps
            const filteredApps = globalAppsList.filter(app => app.category && app.category.toLowerCase() === categoryName.toLowerCase());
            
            // Update Results Section
            const header = document.getElementById('results-header');
            const container = document.getElementById('filtered-apps-container');
            
            header.style.display = 'block';
            header.innerHTML = `Apps in <span style="color: var(--accent-primary);">${categoryName}</span>`;
            
            if (filteredApps.length === 0) {
                container.innerHTML = `<div class="status-container empty-text">No apps found in this category yet.</div>`;
            } else {
                let html = '';
                filteredApps.forEach(app => {
                    html += createAppCard(app);
                });
                container.innerHTML = html;
            }

            // Smooth scroll to results
            header.scrollIntoView({ behavior: 'smooth', block: 'start' });
        };

        // Initialize on DOM load
        document.addEventListener('DOMContentLoaded', initCategoriesPage);
    </script>
</body>
</html>
